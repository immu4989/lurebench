  "model_specificity": "Model agnostic; the evaluated detector may be rules-based, statistical, neural, or an isolated proprietary service, provided its binary decision policy is frozen and its inputs and outcomes can be counted.",
  "domain_specificity": "Domain specific: text phishing, business email compromise, and related fraud or social-engineering lure detection across declared message channels and languages.",
  "usage_details": "Use during pre-deployment evaluation and recurring operational monitoring when stakeholders need comparable clean and adversarial performance evidence without publishing messages or row-level scores. The method is most useful with a representative held-out or consecutive operational cohort, independently adjudicated labels, a preregistered threshold, explicit attack eligibility and budget, and replication across time or sites. Privacy-minimized LureEval receipts permit strict arithmetic verification and pooling of compatible aggregate counts.",
  "known_failure_modes": "The result can mislead when labels leak corpus or source artifacts; the cohort is synthetic, historical, selectively published, or unrepresentative; the threshold is tuned on the reporting cohort; uncertain or failed records are silently omitted; the fixed attack catalog understates an adaptive attacker; multiple subgroup intervals are interpreted as simultaneous confidence; correlated cohorts are treated as independent; or drift invalidates an older receipt. A passing schema or conformance test establishes structural and arithmetic consistency only. It does not verify sampling, labels, issuer truthfulness, security, compliance, or deployment effectiveness.",
