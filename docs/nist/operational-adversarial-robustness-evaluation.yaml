{
  "schema_version": "1.0",
  "name": "Operational Adversarial Robustness Evaluation for Text Fraud-Lure Detection Systems",
  "applied_definition": "A model-agnostic measurement method for a frozen text fraud-detection system on a declared deployment-like cohort. It records TP, FP, TN, and FN; computes recall as TP/(TP+FN), false-positive rate as FP/(FP+TN), and precision as TP/(TP+FP); reports an exact one-sided Clopper-Pearson lower confidence bound for recall and upper bound for false-positive rate; and measures bounded attack evasion as successful evasions divided by eligible positive examples caught before attack. Defense recovery is recovered evasions divided by successful evasions. Zero denominators are reported as null. The detector artifact, threshold, policy, sampling and labeling protocols, confidence, attack budget, and slice-suppression minimum are fixed before test outcomes are examined. Results apply only to the declared cohort, attack set, and evaluation period.",
