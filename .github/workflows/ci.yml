name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --python "${{ matrix.python-version }}" --extra dev --extra train
      - name: Lint
        run: uv run --frozen ruff check lurebench tests scripts
      - name: Tests
        run: uv run --frozen pytest -q
      - name: Run packaged LureEval semantic conformance
        if: matrix.python-version == '3.12'
        run: >-
          uv run --frozen lurebench conformance
          --out "${RUNNER_TEMP}/lureeval-conformance-report.json"
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: uv build

  container-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --python 3.12 --extra dev
      - name: Build reference detector
        run: docker build --tag lurebench-reference-detector:ci examples/container-detector
      - name: Exercise isolated protocol
        run: >-
          uv run --frozen lurebench container-eval
          --dataset data/samples/lures.jsonl
          --image lurebench-reference-detector:ci
          --allow-mutable-image
          --out /tmp/container-evaluation.json
