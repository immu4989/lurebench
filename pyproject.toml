[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lurebench"
version = "0.11.0"
description = "A maintained benchmark and evaluation harness for detecting AI-generated fraud lures (phishing, BEC, romance / pig-butchering)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Imran Ahamed" }]
keywords = [
    "fraud-detection",
    "phishing",
    "llm",
    "benchmark",
    "ai-security",
    "machine-generated-text",
    "social-engineering",
    "agent-security",
    "policy-conformance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []   # the core harness and heuristic baseline run dependency-free

[project.optional-dependencies]
binoculars = ["torch>=2.0", "transformers>=4.38"]
llamaguard = ["torch>=2.0", "transformers>=4.38", "accelerate>=0.26"]
openai = ["openai>=1.0"]
hub = ["huggingface_hub>=0.23"]
generate = ["anthropic>=0.40"]
train = ["scikit-learn>=1.6,<1.7", "joblib>=1.3"]
receipts = ["cryptography>=42"]
dev = ["pytest>=7", "ruff>=0.15,<0.17", "stix2-validator>=3.2", "jsonschema>=4.23", "cryptography>=42", "build>=1.2"]
all = ["torch>=2.0", "transformers>=4.38", "accelerate>=0.26", "openai>=1.0", "huggingface_hub>=0.23", "anthropic>=0.40", "scikit-learn>=1.6,<1.7", "joblib>=1.3", "cryptography>=42"]

[project.scripts]
lurebench = "lurebench.cli:main"

[project.urls]
Homepage = "https://github.com/immu4989/lurebench"
Repository = "https://github.com/immu4989/lurebench"
Issues = "https://github.com/immu4989/lurebench/issues"

[tool.hatch.build.targets.wheel]
